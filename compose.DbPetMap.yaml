services:
  db-petmap:
    image: postgis/postgis:16-master
    container_name: petmap_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: petmap
    networks:
      - petmap
    ports:
      - 0.0.0.0:5430:5432
    volumes:
      - petmap-db_pstgre_gis:/var/lib/postgresql/data
  db-visor-petmap:
    image: adminer
    container_name: adminer_petmap
    ports:
      - "8014:8080"
    networks:
      - petmap
    depends_on:
      db-petmap:
        condition: service_started
        restart: true
    environment:
      ADMINER_PLUGIN: 'table-indexes-structure tables-filter tinymce'
      ADMINER_DESIGN: 'dracula'
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DEFAULT_USER: postgres
      ADMINER_DEFAULT_USER_PASSWORD: postgres
      ADMINER_DEFAULT_SERVER: db-postgre
      ADMINER_DEFAULT_DB_NAME: petmap
volumes:
  petmap-db_pstgre_gis:

networks:
  petmap:
